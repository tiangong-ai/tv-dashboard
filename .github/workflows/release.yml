name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Release jobs never run concurrently or cancel a signing/publishing operation.
concurrency:
  group: tv-dashboard-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, sign and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DASHBOARD_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        run: python3 scripts/release.py validate
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py assert-unpublished
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Run configuration and release guard tests
        env:
          DASHBOARD_TEST_GRADLE: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Lint and build universal ARM APK
        run: ./gradlew :app:lintRelease :app:assembleRelease --no-daemon --console=plain
      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/release.py sign
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$DASHBOARD_RELEASE_TAG" dist/*.apk dist/*.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --fail-on-no-commits \
            --title "TV Dashboard $DASHBOARD_RELEASE_TAG" --generate-notes
