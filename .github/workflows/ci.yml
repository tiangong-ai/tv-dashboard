name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Run configuration and release guard tests
        env:
          DASHBOARD_TEST_GRADLE: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Lint and build universal ARM APK
        run: ./gradlew :app:lintRelease :app:assembleRelease --no-daemon --console=plain
      - name: Verify APK architectures
        run: python3 -c 'from pathlib import Path; from scripts.release import verify_abis; verify_abis(Path("app/build/outputs/apk/release/app-release-unsigned.apk"))'
      - name: Upload unsigned APK and lint report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tv-dashboard-ci-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
